name: チャンネルID解決

on:
  push:
    paths:
      - data/channels.json
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: resolve-channels
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "@名からチャンネルIDと表示名を解決"
        run: python scripts/resolve_channels.py || echo "一部は変換できませんでした（変換待ちのまま）"

      - name: 追加分の動画をすぐ取得
        run: python scripts/update.py

      - name: 変更があればコミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channels.json data/videos.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: チャンネル解決と動画取得 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
