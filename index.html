<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ユーチューブ一覧</title>
  <meta name="description" content="登録した YouTube チャンネルの動画を、公開日順・再生回数順で一覧します。" />
  <meta name="theme-color" content="#f7f5f0" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header>
    <div class="head-row">
      <h1>ユーチューブ一覧</h1>
      <a class="portal-link" href="https://git-san-934.github.io/portal/">アプリ一覧へ</a>
    </div>
    <p class="meta"><span id="updated">読み込み中…</span></p>

    <div class="filter-bar">
      <div class="filter-group">
        <label for="channel-select">チャンネル</label>
        <select id="channel-select">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="sort-select">並び替え</label>
        <select id="sort-select">
          <option value="published">公開日が新しい順</option>
          <option value="views">再生回数が多い順</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <p id="count" class="count" hidden></p>
    <div id="list" class="list"></div>
    <p id="empty" class="empty" hidden>表示できる動画がありません。データ更新をお待ちください。</p>
    <p id="error" class="error" hidden>データを読み込めませんでした。時間をおいて再度お試しください。</p>
  </main>

  <footer>
    <p>
      登録チャンネルの公開フィード（各チャンネル最新15件）を6時間おきに取得し、
      過去に取得した動画も残して蓄積しています。再生回数はYouTubeの公表値で、取得時点のものです。
    </p>
    <p class="admin-link">
      <a href="https://github.com/git-san-934/youtube-ichiran/edit/main/data/channels.json"
         target="_blank" rel="noopener">チャンネルを追加・編集する（GitHub）</a>
    </p>
  </footer>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
